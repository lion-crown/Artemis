<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Artemis 平台架构图</title>
  <desc id="desc">Artemis 本地优先多 Agent 协作平台的接入、运行时、安全、数据和治理架构。</desc>
  <defs>
    <style>
      .bg { fill: #fbfcff; }
      .title { fill: #1c2740; font: 700 35px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      .subtitle { fill: #667085; font: 400 17px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      .section { fill: #263247; font: 700 21px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      .label { fill: #202939; font: 600 17px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      .small { fill: #526078; font: 400 14px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      .box { fill: white; stroke: #d8e0ed; stroke-width: 1.5; }
      .security { fill: #f3f7ff; stroke: #aac8ff; stroke-width: 1.5; }
      .core { fill: #f0fcf7; stroke: #8ee3bd; stroke-width: 1.5; }
      .asset { fill: #f9f8ff; stroke: #c8c1ff; stroke-width: 1.5; }
      .govern { fill: #fff9ef; stroke: #f2c36d; stroke-width: 1.5; }
      .chip { fill: white; stroke: #c9d5e8; stroke-width: 1; }
      .arrow { stroke: #7ed9b4; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#7ed9b4"/></marker>
  </defs>

  <rect class="bg" width="1600" height="900" rx="24"/>
  <text x="800" y="68" text-anchor="middle" class="title">Artemis — 本地优先多 Agent 协作平台</text>
  <text x="800" y="102" text-anchor="middle" class="subtitle">统一接入 · Agent 编排 · 可控运行 · 本地数据与治理</text>

  <!-- Entry -->
  <rect x="45" y="150" width="225" height="430" rx="16" class="box"/>
  <text x="157" y="192" text-anchor="middle" class="section">用户与系统入口</text>
  <g class="chip">
    <rect x="67" y="225" width="180" height="54" rx="12"/><rect x="67" y="304" width="180" height="54" rx="12"/>
    <rect x="67" y="383" width="180" height="54" rx="12"/><rect x="67" y="462" width="180" height="54" rx="12"/>
  </g>
  <text x="157" y="258" text-anchor="middle" class="label">Web 控制台</text>
  <text x="157" y="337" text-anchor="middle" class="label">CLI / ACP</text>
  <text x="157" y="416" text-anchor="middle" class="label">IM 通道</text>
  <text x="157" y="495" text-anchor="middle" class="label">API / MCP</text>

  <!-- security -->
  <rect x="315" y="150" width="220" height="430" rx="16" class="security"/>
  <text x="425" y="192" text-anchor="middle" class="section">接入与安全</text>
  <g class="chip">
    <rect x="338" y="225" width="174" height="54" rx="12"/><rect x="338" y="304" width="174" height="54" rx="12"/>
    <rect x="338" y="383" width="174" height="54" rx="12"/><rect x="338" y="462" width="174" height="54" rx="12"/>
  </g>
  <text x="425" y="258" text-anchor="middle" class="label">身份与权限</text>
  <text x="425" y="337" text-anchor="middle" class="label">TLS / 认证</text>
  <text x="425" y="416" text-anchor="middle" class="label">工具护栏</text>
  <text x="425" y="495" text-anchor="middle" class="label">请求与速率控制</text>

  <!-- Core -->
  <rect x="580" y="150" width="510" height="430" rx="16" class="core"/>
  <text x="835" y="192" text-anchor="middle" class="section">构建与运行</text>
  <rect x="607" y="220" width="455" height="160" rx="14" fill="white" stroke="#b0ecd0" stroke-width="1.5"/>
  <text x="835" y="257" text-anchor="middle" class="section" fill="#25835e">Agent 编排层</text>
  <g class="chip">
    <rect x="628" y="285" width="125" height="58" rx="12"/><rect x="773" y="285" width="125" height="58" rx="12"/><rect x="918" y="285" width="125" height="58" rx="12"/>
  </g>
  <text x="690" y="320" text-anchor="middle" class="label">Agent 运行时</text>
  <text x="835" y="320" text-anchor="middle" class="label">专家与技能</text>
  <text x="980" y="320" text-anchor="middle" class="label">插件与工具</text>
  <rect x="607" y="402" width="455" height="150" rx="14" fill="white" stroke="#b0ecd0" stroke-width="1.5"/>
  <text x="835" y="440" text-anchor="middle" class="section" fill="#25835e">协作运行时</text>
  <g class="chip">
    <rect x="628" y="467" width="125" height="54" rx="12"/><rect x="773" y="467" width="125" height="54" rx="12"/><rect x="918" y="467" width="125" height="54" rx="12"/>
  </g>
  <text x="690" y="500" text-anchor="middle" class="label">多 Agent 协作</text>
  <text x="835" y="500" text-anchor="middle" class="label">会话与任务</text>
  <text x="980" y="500" text-anchor="middle" class="label">工作区隔离</text>

  <!-- Assets -->
  <rect x="1135" y="150" width="420" height="430" rx="16" class="asset"/>
  <text x="1345" y="192" text-anchor="middle" class="section">数据、模型与上下文</text>
  <g class="chip">
    <rect x="1160" y="225" width="370" height="54" rx="12"/><rect x="1160" y="304" width="370" height="54" rx="12"/>
    <rect x="1160" y="383" width="370" height="54" rx="12"/><rect x="1160" y="462" width="370" height="54" rx="12"/>
  </g>
  <text x="1345" y="258" text-anchor="middle" class="label">模型与供应商</text>
  <text x="1345" y="337" text-anchor="middle" class="label">知识库与记忆</text>
  <text x="1345" y="416" text-anchor="middle" class="label">SQLite / PostgreSQL</text>
  <text x="1345" y="495" text-anchor="middle" class="label">连接器与 MCP</text>

  <path class="arrow" d="M270 365 H315"/><path class="arrow" d="M535 365 H580"/><path class="arrow" d="M1090 365 H1135"/>

  <!-- Governance -->
  <rect x="45" y="630" width="1510" height="125" rx="16" class="govern"/>
  <text x="800" y="670" text-anchor="middle" class="section">平台治理</text>
  <g class="chip">
    <rect x="80" y="692" width="190" height="42" rx="11"/><rect x="292" y="692" width="190" height="42" rx="11"/>
    <rect x="504" y="692" width="190" height="42" rx="11"/><rect x="716" y="692" width="190" height="42" rx="11"/>
    <rect x="928" y="692" width="190" height="42" rx="11"/><rect x="1140" y="692" width="190" height="42"/>
    <rect x="1352" y="692" width="165" height="42" rx="11"/>
  </g>
  <text x="175" y="719" text-anchor="middle" class="label">用户与权限</text>
  <text x="387" y="719" text-anchor="middle" class="label">安全审计</text>
  <text x="599" y="719" text-anchor="middle" class="label">定时自动化</text>
  <text x="811" y="719" text-anchor="middle" class="label">消息与通道</text>
  <text x="1023" y="719" text-anchor="middle" class="label">备份与恢复</text>
  <text x="1235" y="719" text-anchor="middle" class="label">日志与可观测性</text>
  <text x="1434" y="719" text-anchor="middle" class="label">策略与配额</text>

  <rect x="270" y="790" width="1060" height="70" rx="15" class="box"/>
  <text x="800" y="819" text-anchor="middle" class="section">观测、评估与持续优化</text>
  <text x="800" y="845" text-anchor="middle" class="small">指标 · 日志 · 调用链路 · 质量评估 · 运行优化</text>
</svg>
