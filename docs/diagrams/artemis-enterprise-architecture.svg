<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1152" viewBox="0 0 2048 1152" role="img" aria-labelledby="title desc">
  <title id="title">Artemis 自托管 AI 助手与多 Agent 协作平台</title>
  <desc id="desc">Artemis 的企业 Agent 入口、安全、构建运行、资产上下文、治理和观测架构。</desc>
  <defs>
    <style>
      .bg{fill:#fff}.panel{fill:#fff;stroke:#d9dee8;stroke-width:2}.security{fill:#f5f8ff;stroke:#b9ccff;stroke-width:2}.core{fill:#f4fcf8;stroke:#a9e7c8;stroke-width:2}.govern{fill:#f7f9ff;stroke:#bbccfb;stroke-width:2}.obs{fill:#fcfcfd;stroke:#d9dee8;stroke-width:2}.pill{fill:#f3f4f6;stroke:#d1d5db;stroke-width:1.5}.blue{fill:#eef4ff;stroke:#aac8ff;stroke-width:1.5}.green{fill:#effbf5;stroke:#56d69a;stroke-width:1.5}.title{font:700 38px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#303846}.head{font:700 24px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#303846}.subhead{font:700 21px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#4ba77d}.label{font:500 18px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#202938}.small{font:400 15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#697386}.arrow{stroke:#b7f2d5;stroke-width:5;fill:none;marker-end:url(#arr)}
    </style>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0 L0 10 L10 5z" fill="#b7f2d5"/></marker>
  </defs>
  <rect class="bg" width="2048" height="1152" rx="20"/>
  <text x="1024" y="76" text-anchor="middle" class="title">Artemis 自托管 AI 助手与多 Agent 协作平台</text>

  <!-- entrance -->
  <rect x="45" y="142" width="245" height="470" rx="16" class="panel"/>
  <text x="167" y="190" text-anchor="middle" class="head">用户与系统入口</text>
  <g class="pill"><rect x="68" y="245" width="198" height="54" rx="12"/><rect x="68" y="330" width="198" height="54" rx="12"/><rect x="68" y="415" width="198" height="54" rx="12"/><rect x="68" y="500" width="198" height="54" rx="12"/></g>
  <text x="167" y="279" text-anchor="middle" class="label">Web 控制台</text><text x="167" y="364" text-anchor="middle" class="label">协作客户端</text><text x="167" y="449" text-anchor="middle" class="label">CLI / ACP</text><text x="167" y="534" text-anchor="middle" class="label">IM / API / MCP</text>

  <!-- inbound -->
  <rect x="330" y="142" width="260" height="470" rx="16" class="security"/>
  <text x="460" y="190" text-anchor="middle" class="head">接入安全防护</text>
  <g class="blue"><rect x="355" y="245" width="210" height="54" rx="12"/><rect x="355" y="330" width="210" height="54" rx="12"/><rect x="355" y="415" width="210" height="54" rx="12"/><rect x="355" y="500" width="210" height="54" rx="12"/></g>
  <text x="460" y="279" text-anchor="middle" class="label">身份认证与权限</text><text x="460" y="364" text-anchor="middle" class="label">TLS / 访问控制</text><text x="460" y="449" text-anchor="middle" class="label">工具护栏与审批</text><text x="460" y="534" text-anchor="middle" class="label">限流与风险拦截</text>

  <!-- core -->
  <rect x="635" y="142" width="760" height="470" rx="16" class="core"/>
  <text x="1015" y="190" text-anchor="middle" class="head">创建与运行</text>
  <rect x="665" y="220" width="500" height="175" rx="14" fill="#fff" stroke="#b3ead0" stroke-width="1.5"/>
  <text x="915" y="261" text-anchor="middle" class="subhead">本地 Agent</text>
  <g class="green"><rect x="690" y="292" width="135" height="52" rx="12"/><rect x="847" y="292" width="135" height="52" rx="12"/><rect x="1004" y="292" width="135" height="52" rx="12"/></g>
  <text x="757" y="325" text-anchor="middle" class="label">Agent 运行时</text><text x="914" y="325" text-anchor="middle" class="label">专家与技能</text><text x="1071" y="325" text-anchor="middle" class="label">插件与工具</text>
  <rect x="665" y="420" width="500" height="162" rx="14" fill="#fff" stroke="#b3ead0" stroke-width="1.5"/>
  <text x="915" y="460" text-anchor="middle" class="subhead">Agent 协作运行时</text>
  <g class="green"><rect x="686" y="490" width="116" height="52" rx="12"/><rect x="816" y="490" width="116" height="52" rx="12"/><rect x="946" y="490" width="116" height="52" rx="12"/><rect x="1076" y="490" width="70" height="52" rx="12"/></g>
  <text x="744" y="523" text-anchor="middle" class="label">多 Agent</text><text x="874" y="523" text-anchor="middle" class="label">会话任务</text><text x="1004" y="523" text-anchor="middle" class="label">工作区隔离</text><text x="1111" y="523" text-anchor="middle" class="label">Cron</text>
  <rect x="1185" y="220" width="178" height="362" rx="14" fill="#fff" stroke="#b3ead0" stroke-width="1.5"/>
  <text x="1274" y="261" text-anchor="middle" class="subhead">ACP 外部协作</text>
  <g class="green"><rect x="1205" y="292" width="138" height="76" rx="12"/><rect x="1205" y="390" width="138" height="126" rx="12"/></g>
  <text x="1274" y="337" text-anchor="middle" class="label">Runner 配置</text><text x="1274" y="445" text-anchor="middle" class="label">外部编码 Agent</text><text x="1274" y="474" text-anchor="middle" class="small">ACP 命令委派</text>

  <!-- assets -->
  <rect x="1440" y="142" width="565" height="470" rx="16" class="panel"/>
  <text x="1722" y="190" text-anchor="middle" class="head">Agent 资产与上下文</text>
  <g class="pill"><rect x="1470" y="245" width="505" height="54" rx="12"/><rect x="1470" y="330" width="505" height="54" rx="12"/><rect x="1470" y="415" width="505" height="54" rx="12"/><rect x="1470" y="500" width="505" height="54" rx="12"/></g>
  <text x="1722" y="279" text-anchor="middle" class="label">模型供应商（云端 / 本地 / 自定义）</text><text x="1722" y="364" text-anchor="middle" class="label">Skill / MCP / 连接器</text><text x="1722" y="449" text-anchor="middle" class="label">记忆、知识库与工作区</text><text x="1722" y="534" text-anchor="middle" class="label">SQLite / PostgreSQL / 对象存储</text>

  <path class="arrow" d="M290 378H330"/><path class="arrow" d="M590 378H635"/><path class="arrow" d="M1395 378H1440"/>

  <!-- governance -->
  <rect x="45" y="670" width="1958" height="126" rx="16" class="govern"/>
  <text x="1024" y="713" text-anchor="middle" class="head">Agent 治理</text>
  <g class="blue"><rect x="75" y="737" width="238" height="42" rx="11"/><rect x="335" y="737" width="238" height="42" rx="11"/><rect x="595" y="737" width="238" height="42" rx="11"/><rect x="855" y="737" width="238" height="42" rx="11"/><rect x="1115" y="737" width="238" height="42" rx="11"/><rect x="1375" y="737" width="238" height="42" rx="11"/><rect x="1635" y="737" width="338" height="42" rx="11"/></g>
  <text x="194" y="765" text-anchor="middle" class="label">用户身份与权限</text><text x="454" y="765" text-anchor="middle" class="label">安全审计</text><text x="714" y="765" text-anchor="middle" class="label">成本与配额</text><text x="974" y="765" text-anchor="middle" class="label">多 Agent 协作</text><text x="1234" y="765" text-anchor="middle" class="label">模型与工具策略</text><text x="1494" y="765" text-anchor="middle" class="label">备份与恢复</text><text x="1804" y="765" text-anchor="middle" class="label">资产准入与风险扫描</text>

  <rect x="330" y="850" width="1370" height="130" rx="16" class="obs"/>
  <text x="1015" y="895" text-anchor="middle" class="head">观测与评估</text>
  <rect x="360" y="918" width="650" height="42" rx="10" class="pill"/><rect x="1030" y="918" width="640" height="42" rx="10" class="pill"/>
  <text x="685" y="946" text-anchor="middle" class="label">指标 / 日志 / 调用链路 / 运行告警</text><text x="1350" y="946" text-anchor="middle" class="label">质量评估 / 审计复盘 / 持续优化</text>
</svg>
