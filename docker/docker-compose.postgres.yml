# =============================================================================
# Local PostgreSQL (+ pgvector) for Artemis dual-backend development / tests
#
# From repo root:
#   docker compose -f docker/docker-compose.postgres.yml up -d
#   docker compose -f docker/docker-compose.postgres.yml down
#
# Connection (default):
#   postgresql://artemis:artemis@127.0.0.1:5432/artemis
#
# For pytest / Artemis:
#   export ARTEMIS_TEST_DATABASE_URL='postgresql://artemis:artemis@127.0.0.1:5432/artemis'
#   export ARTEMIS_DATABASE_URL='postgresql://artemis:artemis@127.0.0.1:5432/artemis'
#
# Init layers (ADR 002):
#   - Control-plane schema → Artemis migrate (NNN_*.pg.sql), not this compose
#   - CREATE EXTENSION vector → postgres/init-vector.sql (initdb.d only)
#   - Agent memory tables → harness-memory at runtime
# =============================================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: artemis-postgres
    restart: unless-stopped
    ports:
      - "${ARTEMIS_PG_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${ARTEMIS_PG_USER:-artemis}
      POSTGRES_PASSWORD: ${ARTEMIS_PG_PASSWORD:-artemis}
      POSTGRES_DB: ${ARTEMIS_PG_DB:-artemis}
    volumes:
      - artemis_pgdata:/var/lib/postgresql/data
      - ./postgres/init-vector.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  artemis_pgdata:
